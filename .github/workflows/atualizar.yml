name: Atualizar cartas

on:
  schedule:
    # A cada 30 min entre 9h e 23h UTC = 6h as 20h de Brasilia.
    - cron: "*/30 9-23 * * *"
  workflow_dispatch:        # botao "Run workflow" para rodar na hora
  push:
    branches: [main]
    paths-ignore:
      - "regras-lume.json"  # o commit do proprio robo nao redispara a rodada
      - "README.md"
      - "PASSO-A-PASSO.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cartas
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Conferir as margens
        # As margens reais vivem nos Secrets; no repositorio publico elas sao 0.
        # Sem o Secret o site sairia com a entrada da LuME, sem agio nenhum.
        env:
          AGIO_CREDITO: ${{ secrets.AGIO_CREDITO }}
        run: |
          if [ -z "$AGIO_CREDITO" ]; then
            echo "::error::Falta o Secret AGIO_CREDITO. Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Coletar a tabela da LuME
        run: python3 coletor.py --saida cotas.json

      - name: Gerar o site
        env:
          # Se os Secrets nao existirem, valem os numeros do marcas/*.json
          AGIO_CREDITO: ${{ secrets.AGIO_CREDITO }}
          COMISSAO_CREDITO: ${{ secrets.COMISSAO_CREDITO }}
        run: python3 site.py --todas

      - name: Guardar o cache de regras
        # So o cache volta para o repositorio. O cotas.json NAO e comitado:
        # ele traz a entrada original da LuME e, comparada com a entrada do
        # site, entregaria o agio para quem abrisse o repositorio.
        # Se o push falhar, a publicacao segue assim mesmo.
        continue-on-error: true
        run: |
          git config user.name  "atualizador"
          git config user.email "atualizador@users.noreply.github.com"
          git add regras-lume.json
          if git diff --cached --quiet; then
            echo "cache sem novidade"
          else
            git commit -m "regras de $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
            git push || echo "push recusado - seguindo para a publicacao"
          fi

      # ---- publicacao no GitHub Pages ----
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
